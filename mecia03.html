<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecia Hack 3.0 - Pac-Man Arcade Login</title>
  <!-- Google Fonts: Arcade & Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Linking External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Arcade CRT Scanlines & Maze Overlay -->
  <div class="scanlines"></div>

  <!-- Animated Pac-Man & Ghosts Marquee Top Track -->
  <div class="arcade-marquee">
    <div class="pacman-runner">
      <div class="pacman"></div>
      <div class="ghost blinky"></div>
      <div class="ghost pinky"></div>
      <div class="ghost inky"></div>
      <div class="ghost clyde"></div>
    </div>
    <div class="pellet-line">
      <span>•</span><span>•</span><span>•</span><span>•</span><span>•</span>
      <span>•</span><span>•</span><span>•</span><span>•</span><span>•</span>
      <span>•</span><span>•</span><span>•</span><span>•</span><span>•</span>
      <span class="power-pellet">●</span>
      <span>•</span><span>•</span><span>•</span><span>•</span><span>•</span>
    </div>
  </div>

  <div class="login-container">
    <!-- Retro Arcade HUD Header -->
    <div class="arcade-hud">
      <span>1UP <span class="hud-yellow">00300</span></span>
      <span class="blink-text">READY!</span>
      <span>HIGH SCORE <span class="hud-yellow">99990</span></span>
    </div>

    <div class="login-header">
      <div class="badge-wrapper">
        <span class="role-badge" id="role-badge">STAGE 1: STUDENT</span>
      </div>
      <h2 id="portal-title">Mecia Hack 3.0</h2>
      <p id="portal-desc">Access your project dashboard and submit entries.</p>
    </div>

    <!-- Theme Toggle Bar -->
    <div class="theme-toggle-bar">
      <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleWebsiteTheme()">
        🌗 CONVERT TO SIMPLE THEME
      </button>
    </div>

    <!-- Role Selection Tabs -->
    <div class="role-tabs">
      <button class="tab-btn active student-tab" onclick="switchRole('student')">
        <span class="tab-ghost red-ghost"></span> Student
      </button>
      <button class="tab-btn judge-tab" onclick="switchRole('judge')">
        <span class="tab-ghost cyan-ghost"></span> Judge
      </button>
      <button class="tab-btn admin-tab" onclick="switchRole('admin')">
        <span class="tab-ghost pink-ghost"></span> Admin
      </button>
    </div>

    <!-- 1. Student Login Form (Strictly Google Account Only) -->
    <div id="student-form" class="login-form active">
      <div class="form-group">
        <label for="project-type">Project Type</label>
        <select id="project-type" name="projectType" required onchange="sessionStorage.setItem('projectType', this.value)">
          <option value="hardware">Hardware</option>
          <option value="software">Software</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </div>

      <div style="background: rgba(33, 33, 255, 0.12); border: 1px dashed rgba(33, 33, 255, 0.6); padding: 12px 14px; border-radius: 8px; color: #a0a0dd; font-size: 0.68rem; font-family: 'Press Start 2P', monospace; line-height: 1.6; margin-bottom: 20px; text-align: center;">
        🔒 STUDENT ACCESS: STRICTLY GOOGLE ACCOUNT AUTHENTICATION ONLY
      </div>

      <button type="button" class="google-oauth-btn" onclick="handleStudentGoogleLogin()" style="width: 100%; padding: 14px 16px; font-size: 0.78rem; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        CONTINUE WITH GOOGLE ACCOUNT
      </button>
    </div>

    <!-- 2. Judge Panel Login Form -->
    <form id="judge-form" class="login-form" action="judge-dashboard.html" method="GET" onsubmit="handleJudgeLogin(event)">
      <div class="form-group">
        <label for="judge-email">Judge Email</label>
        <input type="email" id="judge-email" name="email" placeholder="Enter Judge Email" required>
      </div>
      <div class="form-group">
        <label for="judge-pass">Access Code / Password</label>
        <input type="password" id="judge-pass" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-footer">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Request Code reset</a>
      </div>
      <button type="submit" class="submit-btn"><span class="pacman-icon"></span> LOGIN</button>
    </form>

    <!-- 3. Admin Team Login Form -->
    <form id="admin-form" class="login-form" action="admin-dashboard.html" method="GET" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label for="admin-user">Admin Email ID</label>
        <input type="email" id="admin-user" name="username" placeholder="Enter Admin Email ID" required>
      </div>
      <div class="form-group">
        <label for="admin-pass">Password</label>
        <input type="password" id="admin-pass" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn"><span class="pacman-icon"></span> LOGIN TO ADMIN PORTAL</button>
    </form>

    <!-- Arcade Footer Coin Counter -->
    <div class="arcade-footer">
      <span>INSERT COIN (1 CREDIT)</span>
      <span>LEVEL 3.0</span>
    </div>

  </div>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Linking External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
